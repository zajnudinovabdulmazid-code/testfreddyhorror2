<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мой сайт с видео</title>
  <style>
    body {
      background-color: black;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #myVideo {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 50px auto;
    }
  </style>
</head>
<body>
  <video id="myVideo" autoplay>
    <source src="videos/scary.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
  </video>
  <script>
    const video = document.getElementById("myVideo");
    video.onended = function() {
      window.location.href = "https://example.com";
    };
  </script>
</body>
</html>
